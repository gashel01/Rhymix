name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel in-progress runs for the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend unit tests — pure-Python, no GPU, no model checkpoints.
  #
  # Runs the dubler / magic-wand tests in tests/ AND the Flask route tests in
  # backend/tests/. The latter existed but were never executed by CI, which is
  # how a NameError in the studio job-cancellation path survived in main: the
  # test that catches it was already written.
  #
  # backend/tests/test_dubler_melody.py is excluded by name — it is the only
  # one that transitively imports torch, torchaudio and torchcrepe, and
  # installing a GPU stack to run one file would cost more than it returns.
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install system audio libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run pytest
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ backend/tests/ -v --tb=short \
            --ignore=backend/tests/test_dubler_melody.py

  # ---------------------------------------------------------------------------
  # Frontend — runs the jest suite, then proves the app compiles.
  #
  # The test step is new. @testing-library was never listed in package.json, so
  # `npm test` reported "Cannot find module" for two of the three suites and
  # nobody saw it; they had never run since the day they were written.
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend tests + build (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        # --legacy-peer-deps: typescript@5 is installed against react-scripts@5,
        # which declares a peerOptional of ^3 || ^4. Pre-existing, unrelated to
        # the test libraries, and npm refuses to resolve without it.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Test
        env:
          CI: "true"
        run: npm test -- --watchAll=false

      - name: Build
        env:
          CI: "false" # treat eslint warnings as warnings, not errors
        run: npm run build
